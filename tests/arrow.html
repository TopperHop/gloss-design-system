<!DOCTYPE html>
<html lang="en-us" dir="ltr">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Arrow - Gloss tests</title>
        <script src="js/test.js"></script>
    </head>

    <body>

        <div class="gls-container">

            <h1>Arrow</h1>

            <h2>Direction</h2>

            <div class="gls-child-width-1-4@m" gls-grid>
                <div>
                    <div class="gls-tile gls-tile-default gls-text-center gls-border gls-arrow gls-arrow-r" style="box-shadow: var(--global-medium-box-shadow);">
                        <p class="gls-h4">Right</p>
                    </div>
                </div>
                <div>
                    <div class="gls-tile gls-tile-muted gls-text-center gls-arrow gls-arrow-b" style="border: 1px solid var(--gray-3)">
                        <p class="gls-h4">Bottom</p>
                    </div>
                </div>
                <div>
                    <div class="gls-tile gls-tile-primary gls-text-center gls-arrow gls-arrow-t">
                        <p class="gls-h4">Top</p>
                    </div>
                </div>
                <div>
                    <div class="gls-tile gls-tile-tertiary gls-text-center gls-arrow gls-arrow-l">
                        <p class="gls-h4">Left</p>
                    </div>
                </div>
            </div>

            <h2>Size</h2>

            <div class="gls-child-width-1-2@s gls-text-center" gls-grid>
                <div>
                    <div class="gls-tile gls-tile-primary gls-arrow gls-arrow-small gls-arrow-rt">
                        <p class="gls-h4">Small</p>
                    </div>
                </div>
                <div>
                    <div class="gls-tile gls-tile-tertiary gls-arrow gls-arrow-large gls-arrow-lb">
                        <p class="gls-h4">Large</p>
                    </div>
                </div>
            </div>

        </div>

    </body>
</html>
