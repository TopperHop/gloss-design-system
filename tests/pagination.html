<!DOCTYPE html>
<html lang="en-us" dir="ltr">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Pagination - Gloss tests</title>
        <script src="js/test.js"></script>
    </head>

    <body>

        <div class="gls-container">

            <h1>Pagination</h1>

            <ul class="gls-pagination" gls-margin>
                <li class="gls-disabled"><a><span gls-pagination-previous></span></a></li>
                <li><a href="#"><span gls-pagination-previous></span></a></li>
                <li><a href="#">1</a></li>
                <li class="gls-disabled"><span>…</span></li>
                <li><a href="#">4</a></li>
                <li><a href="#">5</a></li>
                <li><a href="#">6</a></li>
                <li class="gls-active"><span>7</span></li>
                <li><a href="#">8</a></li>
                <li><a href="#">9</a></li>
                <li><a href="#">10</a></li>
                <li class="gls-disabled"><span>…</span></li>
                <li><a href="#">20</a></li>
                <li><a href="#"><span gls-pagination-next></span></a></li>
                <li class="gls-disabled"><a><span gls-pagination-next></span></a></li>
            </ul>

            <ul class="gls-pagination gls-flex-center" gls-margin>
                <li class="gls-disabled"><a><span gls-pagination-previous></span></a></li>
                <li><a href="#"><span gls-pagination-previous></span></a></li>
                <li><a href="#">1</a></li>
                <li class="gls-disabled"><span>…</span></li>
                <li><a href="#">4</a></li>
                <li><a href="#">5</a></li>
                <li><a href="#">6</a></li>
                <li class="gls-active"><span>7</span></li>
                <li><a href="#">8</a></li>
                <li><a href="#">9</a></li>
                <li><a href="#">10</a></li>
                <li class="gls-disabled"><span>…</span></li>
                <li><a href="#">20</a></li>
                <li><a href="#"><span gls-pagination-next></span></a></li>
                <li class="gls-disabled"><a><span gls-pagination-next></span></a></li>
            </ul>

            <ul class="gls-pagination gls-flex-right" gls-margin>
                <li class="gls-disabled"><a><span gls-pagination-previous></span></a></li>
                <li><a href="#"><span gls-pagination-previous></span></a></li>
                <li><a href="#">1</a></li>
                <li class="gls-disabled"><span>…</span></li>
                <li><a href="#">4</a></li>
                <li><a href="#">5</a></li>
                <li><a href="#">6</a></li>
                <li class="gls-active"><span>7</span></li>
                <li><a href="#">8</a></li>
                <li><a href="#">9</a></li>
                <li><a href="#">10</a></li>
                <li class="gls-disabled"><span>…</span></li>
                <li><a href="#">20</a></li>
                <li><a href="#"><span gls-pagination-next></span></a></li>
                <li class="gls-disabled"><a><span gls-pagination-next></span></a></li>
            </ul>

            <h2>Previous/Next</h2>

            <ul class="gls-pagination gls-flex-center">
                <li><a href="#"><span gls-pagination-previous></span> Previous</a></li>
                <li><a href="#">Next <span gls-pagination-next></span></a></li>
            </ul>

            <ul class="gls-pagination">
                <li><a href="#"><span gls-pagination-previous></span> Previous</a></li>
                <li class="gls-margin-auto-left"><a href="#">Next <span gls-pagination-next></span></a></li>
            </ul>

        </div>

    </body>
</html>
