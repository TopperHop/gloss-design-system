<!doctype html>
<html lang="en-us" dir="ltr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Overlay - Gloss tests</title>
        <script src="js/test.js"></script>
    </head>

    <body>
        <div class="gls-container">
            <h1>Overlay</h1>

            <div class="gls-child-width-1-2@m" gls-grid>
                <div>
                    <div class="gls-inline">
                        <img src="images/photo.jpg" width="1800" height="1200" alt="" />
                        <div class="gls-overlay gls-overlay-default gls-position-bottom">
                            <p>Default Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
                        </div>
                    </div>
                </div>
                <div>
                    <div class="gls-inline">
                        <img src="images/photo.jpg" width="1800" height="1200" alt="" />
                        <div class="gls-overlay gls-overlay-primary gls-position-bottom">
                            <p>Primary Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
                        </div>
                    </div>
                </div>
                <div>
                    <div class="gls-inline">
                        <img src="images/photo.jpg" width="1800" height="1200" alt="" />
                        <div class="gls-overlay-default gls-position-cover"></div>
                        <div class="gls-overlay gls-position-bottom gls-dark">
                            <p>Default Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
                        </div>
                    </div>
                </div>
                <div>
                    <div class="gls-inline">
                        <img src="images/photo.jpg" width="1800" height="1200" alt="" />
                        <div class="gls-overlay-primary gls-position-cover"></div>
                        <div class="gls-overlay gls-position-bottom gls-light">
                            <p>Primary Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="gls-child-width-1-3@m" gls-grid>
                <div>
                    <div class="gls-inline gls-light">
                        <img src="images/photo.jpg" width="1800" height="1200" alt="" />
                        <div class="gls-position-center">
                            <span gls-overlay-icon></span>
                        </div>
                    </div>
                </div>
                <div>
                    <div class="gls-inline gls-light">
                        <img src="images/photo.jpg" width="1800" height="1200" alt="" />
                        <div class="gls-overlay-default gls-position-cover">
                            <div class="gls-position-center">
                                <span gls-overlay-icon></span>
                            </div>
                        </div>
                    </div>
                </div>
                <div>
                    <div class="gls-inline gls-light">
                        <img src="images/photo.jpg" width="1800" height="1200" alt="" />
                        <div class="gls-overlay-primary gls-position-cover">
                            <div class="gls-position-center">
                                <span gls-overlay-icon></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="gls-child-width-1-2@s gls-child-width-1-4@l" gls-grid>
                <div>
                    <div class="gls-inline">
                        <img src="images/photo.jpg" alt="" />
                        <div class="gls-overlay-default-gradient-top gls-position-cover"></div>
                    </div>
                </div>
                <div>
                    <div class="gls-inline">
                        <img src="images/photo.jpg" alt="" />
                        <div class="gls-overlay-default-gradient-bottom gls-position-cover"></div>
                    </div>
                </div>
                <div>
                    <div class="gls-inline">
                        <img src="images/photo.jpg" alt="" />
                        <div class="gls-overlay-default-gradient-left gls-position-cover"></div>
                    </div>
                </div>
                <div>
                    <div class="gls-inline">
                        <img src="images/photo.jpg" alt="" />
                        <div class="gls-overlay-default-gradient-right gls-position-cover"></div>
                    </div>
                </div>
            </div>

            <div class="gls-child-width-1-2@s gls-child-width-1-4@l" gls-grid>
                <div>
                    <div class="gls-inline">
                        <img src="images/photo.jpg" alt="" />
                        <div class="gls-overlay-primary-gradient-top gls-position-cover"></div>
                    </div>
                </div>
                <div>
                    <div class="gls-inline">
                        <img src="images/photo.jpg" alt="" />
                        <div class="gls-overlay-primary-gradient-bottom gls-position-cover"></div>
                    </div>
                </div>
                <div>
                    <div class="gls-inline">
                        <img src="images/photo.jpg" alt="" />
                        <div class="gls-overlay-primary-gradient-left gls-position-cover"></div>
                    </div>
                </div>
                <div>
                    <div class="gls-inline">
                        <img src="images/photo.jpg" alt="" />
                        <div class="gls-overlay-primary-gradient-right gls-position-cover"></div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
