<!doctype html>
<html lang="en-us" dir="ltr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Iconnav - Gloss tests</title>
        <script src="js/test.js"></script>
    </head>

    <body>
        <div class="gls-container">
            <h1>Iconnav</h1>

            <h2>Horizontal</h2>

            <ul class="gls-iconnav">
                <li class="gls-active"><a href="#" gls-icon="icon: plus"></a></li>
                <li><a href="#" gls-icon="icon: pencil"></a></li>
                <li><a href="#" gls-icon="icon: copy"></a></li>
                <li>
                    <a href="#"><span gls-icon="icon: trash"></span> (2)</a>
                </li>
                <li>
                    <a href="#"
                        ><span gls-icon="icon: calendar"></span> <span class="gls-badge">2</span></a
                    >
                </li>
            </ul>

            <h2>Vertical</h2>

            <ul class="gls-iconnav gls-iconnav-vertical">
                <li class="gls-active"><a href="#" gls-icon="icon: plus"></a></li>
                <li><a href="#" gls-icon="icon: pencil"></a></li>
                <li><a href="#" gls-icon="icon: copy"></a></li>
                <li>
                    <a href="#"><span gls-icon="icon: trash"></span> (2)</a>
                </li>
                <li>
                    <a href="#"
                        ><span gls-icon="icon: calendar"></span> <span class="gls-badge">2</span></a
                    >
                </li>
            </ul>
        </div>
    </body>
</html>
