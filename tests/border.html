<!doctype html>
<html lang="en-us" dir="ltr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Border - Gloss tests</title>
        <script src="js/test.js"></script>
    </head>

    <body>
        <div class="gls-container">
            <h1>Border</h1>

            <ul class="gls-list">
                <li class="gls-margin-top">
                    <div class="gls-border-top">
                        <span>Border top</span>
                    </div>
                </li>
                <li class="gls-margin-top">
                    <div class="gls-border-right">
                        <span>Border right</span>
                    </div>
                </li>
                <li class="gls-margin-top">
                    <div class="gls-border-bottom">
                        <span>Border bottom</span>
                    </div>
                </li>
                <li class="gls-margin-top">
                    <div class="gls-border-left">
                        <span>Border left</span>
                    </div>
                </li>
                <li class="gls-margin-top">
                    <div class="gls-border">
                        <span>Border all</span>
                    </div>
                </li>
            </ul>

            <h2>Color</h2>

            <ul class="gls-list">
                <li class="gls-margin-top">
                    <div class="gls-border gls-border-primary">
                        <span>Border primary</span>
                    </div>
                </li>
                <li class="gls-margin-top">
                    <div class="gls-border gls-border-secondary">
                        <span>Border secondary</span>
                    </div>
                </li>
                <li class="gls-margin-top">
                    <div class="gls-border gls-border-tertiary">
                        <span>Border tertiary</span>
                    </div>
                </li>
            </ul>

            <h2>Style</h2>

            <ul class="gls-list">
                <li class="gls-margin-top">
                    <div class="gls-border gls-border-dashed">
                        <span>Border dashed</span>
                    </div>
                </li>
                <li class="gls-margin-top">
                    <div class="gls-border gls-border-dotted">
                        <span>Border dotted</span>
                    </div>
                </li>
            </ul>

            <h2>Size</h2>

            <ul class="gls-list">
                <li class="gls-margin-top">
                    <div class="gls-border gls-border-thick">
                        <span>Border thick</span>
                    </div>
                </li>
                <li class="gls-margin-top">
                    <div class="gls-border gls-border-thicker">
                        <span>Border thicker</span>
                    </div>
                </li>
            </ul>
        </div>
    </body>
</html>
